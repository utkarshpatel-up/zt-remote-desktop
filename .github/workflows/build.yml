name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the release on a v* tag

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp Pillow
      - name: Sign-in tests (fake AV Backup server)
        run: python test_av_login.py
      - name: Protocol test (demo agent)
        run: |
          python agent.py --demo --bind 127.0.0.1 --port 8765 &
          sleep 3
          python test_client.py http://127.0.0.1:8765 "$(python -c 'import json;print(json.load(open("zt-remote-config.json"))["token"])')"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ZT-Remote-Desktop-Windows
            backend: _win32
          - os: macos-latest        # Apple Silicon
            name: ZT-Remote-Desktop-macOS-arm64
            backend: _darwin
          - os: macos-15-intel      # Intel Macs
            name: ZT-Remote-Desktop-macOS-intel
            backend: _darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build one-file program
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --onefile --name ZT-Remote-Desktop \
            --add-data "client.html${SEP}." \
            --hidden-import pynput.keyboard.${{ matrix.backend }} \
            --hidden-import pynput.mouse.${{ matrix.backend }} \
            agent.py
      - name: Smoke test the build (demo mode serves the client)
        shell: bash
        run: |
          cd dist
          ./ZT-Remote-Desktop --demo --bind 127.0.0.1 --port 8799 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ | grep -q "ZT Remote Desktop"
          kill %1 || true
          rm -f zt-remote-config.json
      - name: Package
        shell: bash
        run: |
          mkdir pkg && cp dist/ZT-Remote-Desktop* pkg/ && cp README.md pkg/
          cd pkg && 7z a ../${{ matrix.name }}.zip . > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
