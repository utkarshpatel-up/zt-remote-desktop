name: Test and build

# Every push / PR: tests, then the three packages as downloadable artifacts.
# Push a tag v<version> (matching tauri.conf.json) to publish a release with:
#   1. Windows installer   ZT-Remote-Desktop_<v>_x64-setup.exe
#   2. Windows portable    ZT-Remote-Desktop_<v>_Windows-Portable.zip
#   3. macOS universal     ZT-Remote-Desktop_<v>_universal.dmg  (Apple Silicon + Intel)
# plus latest.json + signed update bundles, which installed apps use to
# update themselves ("Update now" in the app).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the release on a v* tag

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Read version (all files agree, and match the tag)
        run: |
          V=$(jq -r .version src-tauri/tauri.conf.json)
          P=$(jq -r .version package.json)
          C=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json=$V package.json=$P Cargo.toml=$C"
          [ "$V" = "$P" ] && [ "$V" = "$C" ] || { echo "::error::versions differ"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libgbm-dev libegl-dev libxdo-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install aiohttp
      - name: Sign-in tests (fake AV Backup server)
        run: python tests/test_av_login.py
      - name: Update-notice tests (fake release feed)
        run: python tests/test_update.py
      - name: Protocol tests (demo mode, moving and still screen)
        run: |
          B=src-tauri/target/debug/zt-remote-desktop
          mkdir -p c1 c2
          $B --headless --demo --bind 127.0.0.1 --port 8765 --config-dir c1 &
          $B --headless --demo --demo-still --bind 127.0.0.1 --port 8766 --config-dir c2 &
          sleep 3
          python tests/test_client.py http://127.0.0.1:8765 "$(jq -r .token c1/zt-remote-config.json)"
          python tests/test_client.py http://127.0.0.1:8766 "$(jq -r .token c2/zt-remote-config.json)" --still

  windows:
    needs: test
    runs-on: windows-latest
    env:
      V: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npx tauri build --bundles nsis
      - name: Smoke test the program
        shell: bash
        run: |
          EXE=src-tauri/target/release/zt-remote-desktop.exe
          mkdir -p smoke
          "$EXE" --headless --demo --bind 127.0.0.1 --port 8799 --config-dir smoke &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/health | grep -q "\"version\":\"$V\""
          curl -sf http://127.0.0.1:8799/ | grep -q "ZT Remote Desktop"
          taskkill //F //IM zt-remote-desktop.exe || true
      - name: Collect installer, update signature and portable zip
        shell: bash
        run: |
          mkdir -p out portable
          N=src-tauri/target/release/bundle/nsis
          cp "$N/ZT Remote Desktop_${V}_x64-setup.exe"     "out/ZT-Remote-Desktop_${V}_x64-setup.exe"
          cp "$N/ZT Remote Desktop_${V}_x64-setup.exe.sig" "out/ZT-Remote-Desktop_${V}_x64-setup.exe.sig"
          cp src-tauri/target/release/zt-remote-desktop.exe "portable/ZT Remote Desktop.exe"
          cp README.md portable/
          cd portable && 7z a "../out/ZT-Remote-Desktop_${V}_Windows-Portable.zip" . > /dev/null
      - name: Installer smoke test (silent install, uninstall)
        shell: pwsh
        run: |
          Start-Process "out\ZT-Remote-Desktop_$($env:V)_x64-setup.exe" -ArgumentList "/S" -Wait
          $dir = "$env:LOCALAPPDATA\ZT Remote Desktop"
          if (-not (Test-Path "$dir\zt-remote-desktop.exe")) { Get-ChildItem $env:LOCALAPPDATA | Select-Object -First 40; throw "not installed" }
          if (-not (Test-Path "$dir\uninstall.exe")) { throw "no uninstaller (app would think it is portable)" }
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/*

  mac:
    needs: test
    runs-on: macos-15
    env:
      V: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Check it is universal and runs
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle/macos
          BIN="$B/ZT Remote Desktop.app/Contents/MacOS/zt-remote-desktop"
          lipo -archs "$BIN" | tee /dev/stderr | grep -q "x86_64 arm64"
          mkdir -p smoke
          "$BIN" --headless --demo --bind 127.0.0.1 --port 8799 --config-dir smoke &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/health | grep -q "\"version\":\"$V\""
          kill %1 || true
      - name: Collect DMG and update bundle
        run: |
          mkdir -p out
          R=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$R/dmg/ZT Remote Desktop_${V}_universal.dmg" "out/ZT-Remote-Desktop_${V}_universal.dmg"
          cp "$R/macos/ZT Remote Desktop.app.tar.gz"      "out/ZT-Remote-Desktop_${V}_universal.app.tar.gz"
          cp "$R/macos/ZT Remote Desktop.app.tar.gz.sig"  "out/ZT-Remote-Desktop_${V}_universal.app.tar.gz.sig"
      - uses: actions/upload-artifact@v5
        with:
          name: mac
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, mac]
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Write latest.json (what installed apps check for updates)
        run: |
          cd out
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}"
          WIN="ZT-Remote-Desktop_${V}_x64-setup.exe"
          MAC="ZT-Remote-Desktop_${V}_universal.app.tar.gz"
          jq -n --arg v "$V" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wsig "$(cat $WIN.sig)" --arg wurl "$BASE/$WIN" \
            --arg msig "$(cat $MAC.sig)" --arg murl "$BASE/$MAC" \
            '{version:$v, notes:"See the release page for what changed.", pub_date:$date, platforms:{
               "windows-x86_64":{signature:$wsig, url:$wurl},
               "darwin-aarch64":{signature:$msig, url:$murl},
               "darwin-x86_64":{signature:$msig, url:$murl}}}' > latest.json
          cat latest.json
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          name: ZT Remote Desktop ${{ env.V }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads
            - **Windows, install:** `ZT-Remote-Desktop_${{ env.V }}_x64-setup.exe`. Installs for your user only, no admin needed. Later updates install from inside the app (**Update now**).
            - **Windows, portable:** `ZT-Remote-Desktop_${{ env.V }}_Windows-Portable.zip`. Unzip anywhere and run `ZT Remote Desktop.exe`. It keeps its settings next to the .exe and tells you when a new version is out.
            - **macOS (Apple Silicon and Intel):** `ZT-Remote-Desktop_${{ env.V }}_universal.dmg`. Drag the app to Applications. The first time, right-click it and choose **Open**. Later updates install from inside the app.

            The builds aren't code-signed by Microsoft or Apple, so Windows SmartScreen may ask once (**More info → Run anyway**). Updates are signed with this project's own update key and checked before they install.
